version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
